services:
  madomasi:
    build:
      context: .
      dockerfile: Dockerfile
    image: madomasi:latest
    container_name: madomasi
    ports:
      - "8501:8501"
    volumes:
      # Persist datasets, models and training outputs outside the container
      - ./data:/app/data
      - ./models:/app/models
      - ./outputs:/app/outputs
      - ./ssl:/app/ssl:ro
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_FILE_WATCHER_TYPE=none
      - STREAMLIT_SERVER_SSL_CERT_FILE=/app/ssl/cert.pem
      - STREAMLIT_SERVER_SSL_KEY_FILE=/app/ssl/key.pem
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
