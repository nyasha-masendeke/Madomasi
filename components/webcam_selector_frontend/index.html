<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: transparent;
    color: #fafafa;
    padding: 4px 2px;
  }
  .row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }
  label { font-size: 12px; color: #aaa; white-space: nowrap; }
  select {
    flex: 1;
    padding: 6px 10px;
    background: #262730;
    color: #fff;
    border: 1px solid #555;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    outline: none;
  }
  select:focus { border-color: #e63946; }
  option.unavailable { color: #888; font-style: italic; }
  .video-wrap {
    width: 100%;
    background: #111;
    border-radius: 10px;
    overflow: hidden;
    line-height: 0;
    position: relative;   /* needed for overlay canvas */
  }
  video { width: 100%; display: block; border-radius: 10px; }
  #overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    border-radius: 10px;
  }
  button {
    width: 100%;
    margin-top: 8px;
    padding: 10px;
    background: #e63946;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover   { background: #c1121f; }
  button:active  { background: #9d0208; }
  button:disabled { background: #555; cursor: not-allowed; }
  .err {
    margin-top: 8px;
    padding: 8px 12px;
    background: #3d0000;
    border: 1px solid #e63946;
    border-radius: 6px;
    font-size: 12px;
    color: #ff8080;
  }
  canvas#canvas { display: none; }
</style>
</head>
<body>

<div class="row">
  <label>Camera:</label>
  <select id="deviceSelect" disabled>
    <option>Detecting cameras…</option>
  </select>
</div>

<div class="video-wrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
</div>

<button id="captureBtn" disabled>📷 Take Photo</button>
<canvas id="canvas"></canvas>
<div class="err" id="errBox" style="display:none"></div>

<script>
// ── Streamlit component protocol ──────────────────────────────────────────────
function sendToStreamlit(type, data) {
  window.parent.postMessage(
    Object.assign({ isStreamlitMessage: true, type: type }, data), "*"
  );
}
function setFrameHeight(h) { sendToStreamlit("streamlit:setFrameHeight", { height: h }); }
function setComponentValue(v) { sendToStreamlit("streamlit:setComponentValue", { value: v, dataType: "json" }); }

let _ready = false;
function sendReady() {
  if (_ready) return;
  sendToStreamlit("streamlit:componentReady", { apiVersion: 1 });
  setTimeout(sendReady, 100);
}
sendReady();
window.addEventListener("message", e => { if (e.data?.type === "streamlit:render") _ready = true; });

// ── Camera helpers ────────────────────────────────────────────────────────────
const video      = document.getElementById("video");
const select     = document.getElementById("deviceSelect");
const captureBtn = document.getElementById("captureBtn");
const canvas     = document.getElementById("canvas");
const overlay    = document.getElementById("overlay");
const errBox     = document.getElementById("errBox");
const octx       = overlay.getContext("2d");

let currentStream = null;
let animFrame     = null;

// Offscreen canvas for downsampled detection
const offscreen = document.createElement("canvas");
const offCtx    = offscreen.getContext("2d");

// Smoothed bounding box (exponential moving average)
let smoothBox = null;
const ALPHA   = 0.25;   // smoothing factor (lower = smoother but laggier)

function syncHeight() {
  requestAnimationFrame(() => setFrameHeight(document.body.scrollHeight + 8));
}
function showErr(msg) {
  errBox.textContent = msg;
  errBox.style.display = "block";
  syncHeight();
}
function hideErr() { errBox.style.display = "none"; }

// ── Leaf-detection helpers ────────────────────────────────────────────────────
function rgbToHsv(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  const v = max;
  const s = max === 0 ? 0 : d / max;
  let h = 0;
  if (d !== 0) {
    if      (max === r) h = ((g - b) / d % 6) * 60;
    else if (max === g) h = ((b - r) / d + 2) * 60;
    else                h = ((r - g) / d + 4) * 60;
    if (h < 0) h += 360;
  }
  return [h, s, v];
}

function isLeaf(r, g, b) {
  const [h, s, v] = rgbToHsv(r, g, b);
  if (s < 0.12 || v < 0.12) return false;      // too grey / too dark
  return (h >= 22 && h <= 168);                  // yellow-green → cyan-green
}

// ── Real-time detection loop ──────────────────────────────────────────────────
const SCALE = 5;           // process at 1/SCALE resolution for performance
const BOX_COLOR  = "#00E650";
const ROI_COLOR  = "rgba(0,230,80,0.45)";

function detectFrame() {
  animFrame = requestAnimationFrame(detectFrame);

  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh || !currentStream) {
    octx.clearRect(0, 0, overlay.width, overlay.height);
    return;
  }

  // Keep overlay pixel-perfect with the rendered video element
  const dw = video.clientWidth, dh = video.clientHeight;
  if (overlay.width !== dw || overlay.height !== dh) {
    overlay.width  = dw;
    overlay.height = dh;
  }

  // Downsample the video for fast pixel scanning
  const pw = Math.ceil(vw / SCALE), ph = Math.ceil(vh / SCALE);
  if (offscreen.width !== pw || offscreen.height !== ph) {
    offscreen.width = pw; offscreen.height = ph;
  }
  offCtx.drawImage(video, 0, 0, pw, ph);
  const data = offCtx.getImageData(0, 0, pw, ph).data;

  let minX = pw, minY = ph, maxX = -1, maxY = -1;
  for (let y = 0; y < ph; y++) {
    for (let x = 0; x < pw; x++) {
      const i = (y * pw + x) * 4;
      if (isLeaf(data[i], data[i+1], data[i+2])) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }

  octx.clearRect(0, 0, dw, dh);

  const leafArea = (maxX - minX) * (maxY - minY);
  const leafFound = maxX >= 0 && leafArea > pw * ph * 0.02;

  const sx = dw / vw, sy = dh / vh;    // scale from video px → display px
  const pad = 12;

  if (leafFound) {
    // Scale detected box back to display coordinates
    let bx = Math.max(0, minX * SCALE * sx - pad);
    let by = Math.max(0, minY * SCALE * sy - pad);
    let bx2 = Math.min(dw, (maxX + 1) * SCALE * sx + pad);
    let by2 = Math.min(dh, (maxY + 1) * SCALE * sy + pad);

    // Smooth the box with EMA
    if (!smoothBox) {
      smoothBox = { bx, by, bx2, by2 };
    } else {
      smoothBox.bx  = smoothBox.bx  + ALPHA * (bx  - smoothBox.bx);
      smoothBox.by  = smoothBox.by  + ALPHA * (by  - smoothBox.by);
      smoothBox.bx2 = smoothBox.bx2 + ALPHA * (bx2 - smoothBox.bx2);
      smoothBox.by2 = smoothBox.by2 + ALPHA * (by2 - smoothBox.by2);
    }

    const { bx: rx, by: ry, bx2: rx2, by2: ry2 } = smoothBox;
    const rw = rx2 - rx, rh = ry2 - ry;

    // Draw box
    octx.strokeStyle = BOX_COLOR;
    octx.lineWidth   = 2.5;
    octx.strokeRect(rx, ry, rw, rh);

    // Filled label tab above the box
    const label = "Leaf detected";
    octx.font = "bold 12px -apple-system, sans-serif";
    const tw = octx.measureText(label).width;
    const tabH = 20, tabW = tw + 10;
    const tabY = Math.max(0, ry - tabH);
    octx.fillStyle = BOX_COLOR;
    octx.fillRect(rx, tabY, tabW, tabH);
    octx.fillStyle = "#000";
    octx.fillText(label, rx + 5, tabY + 14);

  } else {
    // No leaf found — draw a dashed ROI guide centred in the frame
    smoothBox = null;
    const mx = dw * 0.1, my = dh * 0.1;
    const rw = dw * 0.8,  rh = dh * 0.8;
    octx.strokeStyle = ROI_COLOR;
    octx.lineWidth   = 1.5;
    octx.setLineDash([6, 4]);
    octx.strokeRect(mx, my, rw, rh);
    octx.setLineDash([]);
    octx.fillStyle = ROI_COLOR;
    octx.font = "bold 12px -apple-system, sans-serif";
    octx.fillText("Point at a leaf", mx + 8, my + 16);
  }
}

// ── Camera start / stop ───────────────────────────────────────────────────────
async function startCamera(deviceId) {
  if (currentStream) {
    currentStream.getTracks().forEach(t => t.stop());
    currentStream = null;
  }
  if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
  smoothBox = null;
  captureBtn.disabled = true;

  const videoConstraint = deviceId
    ? { deviceId: { exact: deviceId }, width: { ideal: 640 }, height: { ideal: 480 } }
    : { width: { ideal: 640 }, height: { ideal: 480 } };

  currentStream = await navigator.mediaDevices.getUserMedia({ video: videoConstraint, audio: false });
  video.srcObject = currentStream;
  captureBtn.disabled = false;
  hideErr();

  video.onloadedmetadata = () => {
    syncHeight();
    detectFrame();   // ← start real-time bounding box loop
  };
}

// ── Initialisation ────────────────────────────────────────────────────────────
async function init() {
  if (!navigator.mediaDevices?.getUserMedia) {
    showErr("Camera API not available (need localhost or HTTPS).");
    return;
  }

  let cameras = (await navigator.mediaDevices.enumerateDevices())
                  .filter(d => d.kind === "videoinput");
  if (!cameras.length) { showErr("No cameras found."); return; }

  if (!cameras[0].label) {
    let probed = false;
    for (const cam of cameras) {
      try {
        const s = await navigator.mediaDevices.getUserMedia({
          video: cam.deviceId
            ? { deviceId: { exact: cam.deviceId }, width: { ideal: 640 }, height: { ideal: 480 } }
            : { width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false,
        });
        s.getTracks().forEach(t => t.stop());
        probed = true;
        break;
      } catch (_) {}
    }
    if (!probed) { showErr("Camera error: could not access any camera."); return; }
    cameras = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput");
  }

  select.innerHTML = "";
  const available = [];
  for (const cam of cameras) {
    const opt = document.createElement("option");
    opt.value = cam.deviceId;
    let working = false;
    try {
      const s = await navigator.mediaDevices.getUserMedia({
        video: { deviceId: { exact: cam.deviceId }, width: { ideal: 640 }, height: { ideal: 480 } },
        audio: false,
      });
      s.getTracks().forEach(t => t.stop());
      working = true;
    } catch (_) {}

    if (working) {
      opt.textContent = cam.label || "Camera " + (available.length + 1);
      available.push(cam);
    } else {
      opt.textContent = (cam.label || "Camera") + " (unavailable)";
      opt.className = "unavailable";
      opt.disabled = true;
    }
    select.appendChild(opt);
  }
  select.disabled = false;

  if (!available.length) {
    showErr("No working camera found. Try reconnecting your webcam.");
    syncHeight();
    return;
  }

  await startCamera(available[0].deviceId);
  select.value = available[0].deviceId;
  syncHeight();
}

// ── Dropdown change ───────────────────────────────────────────────────────────
select.addEventListener("change", async () => {
  const opt = select.options[select.selectedIndex];
  if (opt.disabled) { showErr("That camera is unavailable on this system."); return; }
  try { await startCamera(select.value); }
  catch (e) { showErr("Camera error: " + e.name + ": " + e.message); }
});

// ── Capture ───────────────────────────────────────────────────────────────────
captureBtn.addEventListener("click", () => {
  if (!currentStream) return;
  const ctx = canvas.getContext("2d");
  if (smoothBox) {
    const vw = video.videoWidth, vh = video.videoHeight;
    const dw = video.clientWidth,  dh = video.clientHeight;
    const srcX = Math.round(smoothBox.bx  * vw / dw);
    const srcY = Math.round(smoothBox.by  * vh / dh);
    const srcW = Math.round((smoothBox.bx2 - smoothBox.bx) * vw / dw);
    const srcH = Math.round((smoothBox.by2 - smoothBox.by) * vh / dh);
    canvas.width  = srcW;
    canvas.height = srcH;
    ctx.drawImage(video, srcX, srcY, srcW, srcH, 0, 0, srcW, srcH);
  } else {
    canvas.width  = video.videoWidth  || 640;
    canvas.height = video.videoHeight || 480;
    ctx.drawImage(video, 0, 0);
  }
  setComponentValue(canvas.toDataURL("image/jpeg", 0.92));
});

syncHeight();
init();
</script>
</body>
</html>
